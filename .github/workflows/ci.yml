# Runs only when code changes. Doc-only changes are answered by ci-skip.yml,
# which reports the same check names as passing (see docs/DECISIONS.md, ADR-0005).
# Keep the `paths` lists here and in ci-skip.yml in sync.
name: CI

on:
  push:
    branches: [main]
    paths: &code-paths
      - "crates/**"
      - "templates/**"
      - "install/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
  pull_request:
    paths: *code-paths

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info --fail-under-lines 80
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta
      # Fails on mismatched, pending or orphaned snapshots.
      # No --locked: cargo-insta's doctest runner doesn't accept it (lockfile
      # integrity is already checked by the other jobs, which all use it).
      - run: cargo insta test --workspace --check --unreferenced=reject

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install/install.sh
