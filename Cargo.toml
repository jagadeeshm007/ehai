[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/jagadeeshm007/ehai"
publish = false

[workspace.dependencies]
ehai-core = { path = "crates/ehai-core" }
ehai-stack = { path = "crates/ehai-stack" }
ehai-env = { path = "crates/ehai-env" }
ehai-mcp = { path = "crates/ehai-mcp" }
ehai-adapters = { path = "crates/ehai-adapters" }
ehai-tracker = { path = "crates/ehai-tracker" }
ehai-guard = { path = "crates/ehai-guard" }
ehai-planner = { path = "crates/ehai-planner" }
ehai-poc = { path = "crates/ehai-poc" }
ehai-prefs = { path = "crates/ehai-prefs" }
ehai-update = { path = "crates/ehai-update" }


anyhow = "1.0.104"
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "time"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
cliclack = "0.5.7"
console = "0.16.6"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
tar = "0.4.46"
flate2 = "1.1.11"
minisign-verify = "0.3.0"
self-replace = "1.5.1"
semver = "1.0.24"
# dev
assert_cmd = "2.2.2"
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
