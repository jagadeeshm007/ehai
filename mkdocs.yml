site_name: ehai
site_url: https://jagadeeshm007.github.io/ehai/
site_description: AI-SDLC ops engine for any team — plan, track, and prototype from any AI harness
repo_url: https://github.com/jagadeeshm007/ehai
repo_name: jagadeeshm007/ehai
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: deep orange
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/lightning-bolt-circle
  favicon: https://raw.githubusercontent.com/jagadeeshm007/ehai/main/docs/assets/favicon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.view

extra_css:
  - stylesheets/claude.css

extra_javascript:
  - javascripts/copy-markdown.js

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Guide:
      - How it works: guide/how-it-works.md
      - Quickstart: guide/quickstart.md
      - Setup & Connections: guide/setup.md
      - Use Cases: guide/use-cases.md
      - With spec-driven tools: guide/spec-driven.md
      - Data Policy: guide/compliance.md
  - Reference:
      - Skills: reference/skills.md
      - MCP Tools: reference/mcp-tools.md
      - Config: reference/config.md
  - Project:
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
      - Decisions: DECISIONS.md
