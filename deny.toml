[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Only licenses actually in the tree; extend as new deps land (rustls brings ISC etc.).
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are UNLICENSED + publish = false.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # rustls only; the static musl binary must not need system OpenSSL.
  { crate = "openssl-sys" },
  { crate = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
