[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # chrono is unmaintained (RUSTSEC-2026-0543), with "no safe upgrade available" per
  # the advisory itself. Pulled transitively, not a direct dependency, by two crates
  # we can't drop: rmcp (the MCP SDK) and schemars (config JSON schema generation).
  # Revisit if either stops depending on it, or a patched chrono/alternative ships.
  "RUSTSEC-2026-0543",
]

[licenses]
# Only licenses actually in the tree; all permissive. ISC/BSD-3/MIT-0 arrive with
# rustls + aws-lc, CDLA-Permissive-2.0 with webpki root certificates (M2),
# Zlib with foldhash (serde_json preserve_order, M3).
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "MIT-0", "CDLA-Permissive-2.0", "Zlib"]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are UNLICENSED + publish = false.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # rustls only; the static musl binary must not need system OpenSSL.
  { crate = "openssl-sys" },
  { crate = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
